<!DOCTYPE html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>สวนสุขใจ – เกมทำฟาร์ม</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4efe0;--fg:#3b2f1e;--card:#fffaf0;--line:#d9c9a3;--acc:#5c9a3c;--bar:#e8dcc0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1a14;--fg:#f0e8d4;--card:#2a251b;--line:#4a4130;--acc:#6dae4b;--bar:#3a3325}}
:root[data-theme="dark"]{--bg:#1d1a14;--fg:#f0e8d4;--card:#2a251b;--line:#4a4130;--acc:#6dae4b;--bar:#3a3325}
html,body{height:100%}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:Sarabun,system-ui,sans-serif;-webkit-user-select:none;user-select:none;touch-action:manipulation}
#app{max-width:520px;margin:0 auto;padding:8px}
.stage{position:relative}
canvas{width:100%;display:block;border-radius:12px;border:3px solid #b9803f}
.hudo{position:absolute;left:6px;top:6px;z-index:3;background:#fff6e0;color:#4a3320;border:2px solid #d9a35a;border-radius:10px;padding:2px 7px 3px;font-size:10px;line-height:1.3;box-shadow:0 2px 0 #b9803f}
.hudo b{font-size:11px}.hrt{font-size:10px}
.mn,.bagb{position:absolute;z-index:3;border:2px solid #b9803f;background:#f2a23a;color:#fff;font-family:inherit;font-weight:700;border-radius:12px;box-shadow:0 2px 0 #b9803f}
.mn{right:6px;top:68px;padding:3px 8px;font-size:11px}
.bagb{left:6px;bottom:6px;width:58px;height:58px;font-size:12px;line-height:1.1;background:#fff6e0;color:#4a3320}.bagb span{font-size:24px;display:block}
#toast{position:absolute;left:70px;right:8px;bottom:8px;background:rgba(0,0,0,.72);color:#fff;border-radius:8px;padding:4px 8px;font-size:13px;text-align:center;display:none;pointer-events:none;z-index:4}
.panel{position:absolute;inset:4px;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:10px;overflow:auto;display:none;z-index:6;font-size:14px}
.x{float:right;border:0;background:var(--bar);color:var(--fg);border-radius:8px;padding:2px 9px;font-size:15px}
.row{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:4px 0;border-bottom:1px dashed var(--line)}
.row button,.modes button{font-family:inherit;border:1px solid var(--line);background:var(--bar);color:var(--fg);border-radius:8px;padding:4px 8px}
.row button{font-size:12px;margin-left:3px}
.modes{display:flex;gap:4px;margin:6px 0}.modes button{flex:1;font-size:12px;padding:5px 0;line-height:1.2}.modes button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
.ctl{display:flex;justify-content:space-between;align-items:center;margin-top:4px}
.dp{display:grid;grid-template-columns:repeat(3,54px);grid-template-rows:repeat(3,54px);gap:3px}
.dp button{border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:12px;font-size:20px;touch-action:none}
#act{width:96px;height:96px;border-radius:50%;background:var(--acc);color:#fff;font-size:18px;font-weight:700;border:0;font-family:inherit}
small{opacity:.75}
#mini{position:absolute;right:6px;top:6px;z-index:3;width:80px;height:57px;border:2px solid #b9803f;border-radius:8px;background:#000}
.hb{display:inline-block;width:46px;height:7px;background:#e8d9b5;border-radius:5px;vertical-align:middle;overflow:hidden}.hb i{display:block;height:100%}
#say{position:absolute;left:6px;right:6px;top:6px;z-index:9;display:none;background:#fffdf5;color:#3b2f1e;border:3px solid #8a5a2b;border-radius:16px;padding:8px 14px 10px;font-size:15px;line-height:1.45;box-shadow:0 4px 0 #b9803f,0 8px 18px rgba(0,0,0,.35)}
.hd{background:linear-gradient(135deg,#b9803f,#f2c94c);color:#3b2214;border-radius:12px;padding:8px 12px;font-weight:700;font-size:16px;margin:0 0 8px;box-shadow:0 2px 0 #8a5a2b}.fc{display:flex;align-items:center;gap:8px;padding:6px 8px;margin:5px 0;border-radius:12px;background:var(--card);border:1px solid var(--line);box-shadow:0 1px 0 var(--line)}.fc.gold{background:linear-gradient(135deg,#fff3c4,#ffe08a);border-color:#d9a017;color:#3b2214}.fc .t{flex:1;min-width:0}.fc .n{font-weight:700;font-size:14px}.fc .s{font-size:11px;opacity:.8}.bar{height:7px;border-radius:4px;background:var(--bar);overflow:hidden;margin-top:3px}.bar i{display:block;height:100%;border-radius:4px}.bd{font-size:10px;padding:1px 7px;border-radius:9px;color:#fff;white-space:nowrap;font-weight:400}.rk{width:28px;text-align:center;font-size:20px}
#cover{position:fixed;inset:0;z-index:50;background:linear-gradient(#cdeef6 0,#d6f0f3 40%,#8cc45a 100%);overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:12px;padding:0 24px calc(34px + env(safe-area-inset-bottom,0px))}
.big{position:relative;z-index:1;font-family:inherit;font-weight:700;font-size:24px;color:#fff;background:linear-gradient(#ffb347,#f2802a);border:3px solid #8a4a14;border-radius:44px;padding:12px 48px;box-shadow:0 6px 0 #8a4a14,0 10px 20px rgba(0,0,0,.3);animation:pu 1.6s ease-in-out infinite}
.big.alt{font-size:16px;background:linear-gradient(#8ac26b,#5c9a3c);border-color:#35601f;box-shadow:0 4px 0 #35601f;padding:8px 30px;animation:none}
#cover:before{content:'';position:absolute;inset:0;background:var(--cv) center/contain no-repeat}
@keyframes pu{50%{transform:scale(1.05)}}

#cc h3{margin:0 0 8px;font-size:18px}#nm{width:100%;font-family:inherit;font-size:16px;padding:8px 12px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--fg);margin-bottom:8px}
.cr{display:flex;align-items:center;gap:6px;margin:6px 0}.cr b{width:64px;font-size:14px}
.opt{flex:1;font-family:inherit;font-size:13px;padding:7px 4px;border-radius:12px;border:2px solid var(--line);background:var(--bar);color:var(--fg);display:flex;align-items:center;justify-content:center;gap:5px}
.opt i{width:16px;height:16px;border-radius:50%;border:1px solid rgba(0,0,0,.35);display:inline-block}.opt.on{border-color:#f2802a;background:#ffe6c4;color:#3b2214;font-weight:700}
#app.pre .modes,#app.pre .ctl,#app.pre .hudo,#app.pre #mini,#app.pre .mn,#app.pre .bagb,#app.pre p{display:none}
